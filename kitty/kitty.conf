# ═══════════════════════════════════════════════════════════════════
# UNION THEME — KITTY TERMINAL CONFIGURATION
# Unified National Institute for Orbital and Nuclear Research
# Государственный институт специальных исследований
# Facility 04 — Terminal 7B-114
# ═══════════════════════════════════════════════════════════════════

# ─── FONT ────────────────────────────────────────────────────────
font_family      JetBrains Mono
bold_font        JetBrains Mono Bold
italic_font      JetBrains Mono Italic
bold_italic_font JetBrains Mono Bold Italic
font_size        11.0

# ─── CURSOR ──────────────────────────────────────────────────────
cursor_shape          block
cursor_blink_interval 0
cursor_stop_blinking_after 0

# ─── SCROLLBACK ──────────────────────────────────────────────────
scrollback_lines 10000

# ─── MOUSE ───────────────────────────────────────────────────────
copy_on_select          clipboard
strip_trailing_spaces   smart
url_style               curly

# ─── BELL ────────────────────────────────────────────────────────
enable_audio_bell no
visual_bell_duration 0

# ─── WINDOW ──────────────────────────────────────────────────────
window_padding_width 4
hide_window_decorations yes
confirm_os_window_close 0
initial_window_width  100c
initial_window_height 30c

# ─── TAB BAR ─────────────────────────────────────────────────────
tab_bar_edge   top
tab_bar_style  powerline
tab_powerline_style slanted

# ═══════════════════════════════════════════════════════════════════
# UNION COLOR SCHEME
# Classification: Facility Design Colors
# ═══════════════════════════════════════════════════════════════════

# ─── BACKGROUND ──────────────────────────────────────────────────
background #1a1d23
background_opacity 0.95

# ─── FOREGROUND ──────────────────────────────────────────────────
foreground #c8cdd5
dim_foreground #5c6370

# ─── CURSOR ──────────────────────────────────────────────────────
cursor #c8cdd5
cursor_text_color #1a1d23

# ─── SELECTION ───────────────────────────────────────────────────
selection_foreground #c8cdd5
selection_background #3d4250

# ─── URL HOVER ───────────────────────────────────────────────────
url_color #5e81ac

# ─── TAB BAR ─────────────────────────────────────────────────────
active_tab_foreground   #c8cdd5
active_tab_background   #2a2e37
inactive_tab_foreground #5c6370
inactive_tab_background #1a1d23
tab_bar_background      #1a1d23

# ─── MARKS ───────────────────────────────────────────────────────
mark1_foreground #1a1d23
mark1_background #5e81ac
mark2_foreground #1a1d23
mark2_background #b85450
mark3_foreground #1a1d23
mark3_background #6a9f78

# ─── STANDARD COLORS ─────────────────────────────────────────────
# Black
color0 #1a1d23
color8 #343842

# Red
color1 #b85450
color9 #cf6b68

# Green
color2 #6a9f78
color10 #82b892

# Yellow/Amber
color3 #d4a04a
color11 #e4b862

# Blue
color4 #5e81ac
color12 #7aa2cf

# Magenta
color5 #8b7bab
color13 #a595c5

# Cyan
color6 #5e9fb0
color14 #76b8ca

# White
color7 #c8cdd5
color15 #e4e8ef

# ═══════════════════════════════════════════════════════════════════
# UNION KEYBOARD SHORTCUTS
# ═══════════════════════════════════════════════════════════════════

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+t new_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0 change_font_size all 0
map ctrl+shift+f5 load_config_file
