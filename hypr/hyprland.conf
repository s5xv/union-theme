# â”€â”€â”€ INPUT â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
input {
    kb_layout = us,ara
    kb_variant =
    kb_model =
    kb_options = grp:alt_shift_toggle
    kb_rules =

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
    }

    numlock_by_default = true
}

# â”€â”€â”€ GENERAL â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 1

    col.active_border = rgb(5c6370)
    col.inactive_border = rgb(2a2e37)

    layout = dwindle
    allow_tearing = false
}

# â”€â”€â”€ DECORATION â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
decoration {
    rounding = 4

    blur {
        enabled = true
        size = 4
        passes = 2
        noise = 0.02
        contrast = 1.0
        brightness = 0.9
        new_optimizations = true
        xray = false
    }

    drop_shadow = true
    shadow_range = 8
    shadow_render_power = 2
    col.shadow = rgba(1a1d2380)

    dim_inactive = true
    dim_strength = 0.05
}

# â”€â”€â”€ ANIMATIONS â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
animations {
    enabled = true

    bezier = union_linear, 0.0, 0.0, 1.0, 1.0
    bezier = union_smooth, 0.25, 0.1, 0.25, 1.0
    bezier = union_quick, 0.3, 0.0, 0.5, 1.0

    animation = windowsIn, 1, 4, union_smooth, slide
    animation = windowsOut, 1, 4, union_smooth, slide
    animation = windowsMove, 1, 3, union_smooth
    animation = border, 1, 6, union_linear
    animation = borderangle, 1, 6, union_linear
    animation = fade, 1, 3, union_smooth
    animation = workspaces, 1, 3, union_quick, slide
}

# â”€â”€â”€ LAYOUTS â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
dwindle {
