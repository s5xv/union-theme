# â”€â”€â”€ WINDOW RULES â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
# Floating windows
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(org.gnome.Calculator)$
windowrulev2 = float, class:^(feh)$
windowrulev2 = float, class:^(mpv)$
windowrulev2 = float, class:^(file-roller)$
windowrulev2 = float, title:^(Open File)$
windowrulev2 = float, title:^(Save File)$
windowrulev2 = float, title:^(Confirm)$
windowrulev2 = float, title:^(Picture-in-Picture)$

# Workspace assignments
windowrulev2 = workspace 1, class:^(thunar|nautilus|dolphin|pcmanfm|nemo)$
windowrulev2 = workspace 2, class:^(firefox|chromium|brave|vivaldi|qutebrowser)$
windowrulev2 = workspace 3, class:^(code|vscode|codium)$
windowrulev2 = workspace 4, class:^(libreoffice|onlyoffice|zathura|evince)$
windowrulev2 = workspace 5, class:^(discord|telegram|signal|slack|teams)$
windowrulev2 = workspace 6, class:^(kitty|alacritty|foot|wezterm)$

# Opacity rules
windowrulev2 = opacity 0.95 0.90, class:^(kitty)$
windowrulev2 = opacity 0.95 0.90, class:^(alacritty)$
windowrulev2 = opacity 0.90 0.85, class:^(firefox)$
windowrulev2 = opacity 0.95 0.90, class:^(thunar)$
windowrulev2 = opacity 0.95 0.95, class:^(code)$
windowrulev2 = opacity 0.95 0.90, class:^(code-oss)$

# Size rules
windowrulev2 = size 800 600, title:^(Open File)$
windowrulev2 = size 800 600, title:^(Save File)$
windowrulev2 = size 900 700, class:^(pavucontrol)$
windowrulev2 = size 600 400, class:^(blueman-manager)$

# Layer rules for waybar/mako
layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = blur, mako
layerrule = ignorealpha 0.5, mako

