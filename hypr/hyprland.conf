# ═══════════════════════════════════════════════════════════════════
# UNION — HYPRLAND CONFIGURATION
# Unified National Institute for Orbital and Nuclear Research
# Государственный институт специальных исследований
# Facility 04 — Terminal 7B-114
# ═══════════════════════════════════════════════════════════════════

# ─── MONITORS ────────────────────────────────────────────────────
monitor = , preferred, auto, 1

# ─── AUTOSTART ───────────────────────────────────────────────────
exec-once = waybar
exec-once = mako
exec-once = swww-daemon
exec-once = /usr/local/bin/union-wallpaper --init
exec-once = /usr/local/bin/union-notify --system "SYSTEM INITIALIZED" "UNION workstation online. Facility 04, Terminal 7B-114."

# ─── ENVIRONMENT ─────────────────────────────────────────────────
env = XCURSOR_SIZE, 24
env = QT_QPA_PLATFORMTHEME, qt5ct

# ─── INPUT ───────────────────────────────────────────────────────
input {
    kb_layout = us,ara
    kb_variant =
    kb_model =
    kb_options = grp:alt_shift_toggle
    kb_rules =

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
    }

    numlock_by_default = true
}

# ─── GENERAL ─────────────────────────────────────────────────────
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 1

    col.active_border = rgb(5c6370)
    col.inactive_border = rgb(2a2e37)

    layout = dwindle
    allow_tearing = false
}

# ─── DECORATION ──────────────────────────────────────────────────
decoration {
    rounding = 4

    blur {
        enabled = true
        size = 4
        passes = 2
        noise = 0.02
        contrast = 1.0
        brightness = 0.9
        new_optimizations = true
        xray = false
    }

    drop_shadow = true
    shadow_range = 8
    shadow_render_power = 2
    col.shadow = rgba(1a1d2380)

    dim_inactive = true
    dim_strength = 0.05
}

# ─── ANIMATIONS ──────────────────────────────────────────────────
animations {
    enabled = true

    bezier = union_linear, 0.0, 0.0, 1.0, 1.0
    bezier = union_smooth, 0.25, 0.1, 0.25, 1.0
    bezier = union_quick, 0.3, 0.0, 0.5, 1.0

    animation = windowsIn, 1, 4, union_smooth, slide
    animation = windowsOut, 1, 4, union_smooth, slide
    animation = windowsMove, 1, 3, union_smooth
    animation = border, 1, 6, union_linear
    animation = borderangle, 1, 6, union_linear
    animation = fade, 1, 3, union_smooth
    animation = workspaces, 1, 3, union_quick, slide
}

# ─── LAYOUTS ─────────────────────────────────────────────────────
dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
}

master {
    new_status = master
}

# ─── MISC ────────────────────────────────────────────────────────
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vfr = true
}

# ─── WINDOW RULES ────────────────────────────────────────────────
# Floating windows
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(org.gnome.Calculator)$
windowrulev2 = float, class:^(feh)$
windowrulev2 = float, class:^(mpv)$
windowrulev2 = float, class:^(file-roller)$
windowrulev2 = float, title:^(Open File)$
windowrulev2 = float, title:^(Save File)$
windowrulev2 = float, title:^(Confirm)$
windowrulev2 = float, title:^(Picture-in-Picture)$

# Workspace assignments
windowrulev2 = workspace 1, class:^(thunar|nautilus|dolphin|pcmanfm|nemo)$
windowrulev2 = workspace 2, class:^(firefox|chromium|brave|vivaldi|qutebrowser)$
windowrulev2 = workspace 3, class:^(code|vscode|codium)$
windowrulev2 = workspace 4, class:^(libreoffice|onlyoffice|zathura|evince)$
windowrulev2 = workspace 5, class:^(discord|telegram|signal|slack|teams)$
windowrulev2 = workspace 6, class:^(kitty|alacritty|foot|wezterm)$

# Opacity rules
windowrulev2 = opacity 0.95 0.90, class:^(kitty)$
windowrulev2 = opacity 0.95 0.90, class:^(alacritty)$
windowrulev2 = opacity 0.90 0.85, class:^(firefox)$
windowrulev2 = opacity 0.95 0.90, class:^(thunar)$
windowrulev2 = opacity 0.95 0.95, class:^(code)$
windowrulev2 = opacity 0.95 0.90, class:^(code-oss)$

# Size rules
windowrulev2 = size 800 600, title:^(Open File)$
windowrulev2 = size 800 600, title:^(Save File)$
windowrulev2 = size 900 700, class:^(pavucontrol)$
windowrulev2 = size 600 400, class:^(blueman-manager)$

# Layer rules for waybar/mako
layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = blur, mako
layerrule = ignorealpha 0.5, mako

# ─── KEYBINDINGS ─────────────────────────────────────────────────
$mainMod = SUPER

# Core
bind = $mainMod, Return, exec, kitty
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, M, exit
bind = $mainMod, E, exec, thunar
bind = $mainMod, V, togglefloating
bind = $mainMod, D, exec, rofi -show drun -show-icons
bind = $mainMod, P, pseudo
bind = $mainMod, J, togglesplit

# Language switching: SUPER+Space toggles Arabic/English
bind = $mainMod, Space, exec, hyprctl keyword input:kb_layout $($(hyprctl getoption input:kb_layout -j | jq -r '.str') = "us,ara" && echo "ara,us" || echo "us,ara")

# Screenshots
bind = , Print, exec, grimblast copy area
bind = SHIFT, Print, exec, grimblast copy screen
bind = $mainMod, Print, exec, grimblast save area ~/Pictures/union/screenshot-$(date +%Y%m%d-%H%M%S).png
bind = $mainMod SHIFT, Print, exec, grimblast copy screen && /usr/local/bin/union-notify --transfer "CAPTURE COMPLETE" "Full screen archived."

# Clipboard
bind = $mainMod, C, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy

# File manager quick access
bind = $mainMod SHIFT, E, exec, kitty ranger

# Focus (arrow keys)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Focus (vim keys)
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Move windows (arrow keys)
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Move windows (vim keys)
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d

# Resize
binde = $mainMod CTRL, left, resizeactive, -40 0
binde = $mainMod CTRL, right, resizeactive, 40 0
binde = $mainMod CTRL, up, resizeactive, 0 -40
binde = $mainMod CTRL, down, resizeactive, 0 40

# Workspaces (1-6)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6

# Move to workspace (1-6)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6

# Scroll through workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Media keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ && /usr/local/bin/union-notify --audio "OUTPUT: $(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{print int($2*100)}')%"
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && /usr/local/bin/union-notify --audio "OUTPUT: $(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{print int($2*100)}')%"
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5% && /usr/local/bin/union-notify --optical "INTENSITY: $(brightnessctl -m | awk -F, '{print $4}' | head -1)"
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%- && /usr/local/bin/union-notify --optical "INTENSITY: $(brightnessctl -m | awk -F, '{print $4}' | head -1)"

# Power
bindl = , XF86PowerOff, exec, systemctl suspend

# Fullscreen
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1

# Pin window
bind = $mainMod, N, pin

# Lock screen
bind = $mainMod SHIFT, L, exec, loginctl lock-session

# Toggle pseudo tiled
bind = $mainMod, T, toggletiled
