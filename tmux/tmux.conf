# UNION THEME â€” TMUX CONFIGURATION
# Unified National Institute for Orbital and Nuclear Research
# Facility 04 â€” Terminal 7B-114
# Document: UN-04-TMX-001  |  Classification: RESTRICTED
# â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•

# â”€â”€â”€ PREFIX â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# â”€â”€â”€ GENERAL â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-kitty:RGB"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -sg escape-time 0
set -g focus-events on
set -g set-clipboard on

# â”€â”€â”€ KEY BINDINGS â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
bind r source-file ~/.tmux.conf \; display "UNION // CONFIG RELOADED"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind X confirm-before -p "Kill session? (y/n)" kill-session

# Vim-style navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window navigation
bind -r C-h previous-window
bind -r C-l next-window
bind -r S-Left previous-window
bind -r S-Right next-window

# Move windows
bind -r < swap-window -t -1
bind -r > swap-window -t +1

# â”€â”€â”€ STATUS BAR â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
set -g status-position top
set -g status-interval 1
set -g status-justify left
set -g status-style "bg=#22262e,fg=#c8cdd5"

# Left
set -g status-left-length 40
set -g status-left "#[fg=#b85450,bold] â—‰âŠ•â—‰ #[fg=#5c6370]â”‚ #[fg=#8891a0]#S "

# Right
set -g status-right-length 80
set -g status-right "#[fg=#5c6370]â”‚ #[fg=#6a9f78]CPU #[fg=#8891a0]#(top -bn1 | grep 'Cpu(s)' | awk '{print \$2}')% #[fg=#5c6370]Â· #[fg=#5e81ac]MEM #[fg=#8891a0]#(free -h | awk '/Mem:/ {print \$3}') #[fg=#5c6370]Â· #[fg=#d4a04a]%H:%M #[fg=#5c6370]Â· #[fg=#8891a0]%d-%m-%Y "

# Window status
setw -g window-status-format "#[fg=#5c6370] #I:#W "
setw -g window-status-current-format "#[fg=#b85450,bold] #I:#W "
setw -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#3d4250"
set -g pane-active-border-style "fg=#5c6370"

# Messages
set -g message-style "fg=#b85450,bg=#22262e,bold"

# Clock
setw -g clock-mode-colour "#b85450"

# â”€â”€â”€ COPY MODE â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'wl-copy'
bind -T copy-mode-vi Escape send -X cancel

