# Info
print_info() {
    title

    # System info
    info "OS" distro
    info "Kernel" kernel
    info "Uptime" uptime
    info "Packages" packages
    info "Shell" shell
    info "Terminal" term
    info "DE" de
    info "WM" wm
    info "WM Theme" wm_theme
    info "Theme" theme
    info "Icons" icons
    info "Terminal Font" term_font
    info "CPU" cpu
    info "GPU" gpu
    info "Memory" memory
    info "Disk" disk
    info "Local IP" local_ip
    info "Battery" battery
    info "Kernel Modules" kernel_modules

    # Separator
    line

    # UNION fictional metadata
    info "FACILITY" union_facility
    info "DIRECTORATE" union_directorate
    info "CLEARANCE" union_clearance
    info "STATUS" union_status

    separator
}

# UNION fictional info
union_facility="04"
union_directorate="ORBITAL RESEARCH"
union_clearance="RESTRICTED"
union_status="OPERATIONAL"

# Colors
colors=(distro)
bold="on"

# Title
title_fqdn="off"
title_color="red"

# OS
os_arch="on"
